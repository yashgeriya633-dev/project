<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <link rel="stylesheet" href="signup.css" />

  <style>
    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      width: 100%;
      padding-right: 60px; /* space for toggle text */
    }

    .toggle-text {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 14px;
      color: #007BFF;
      user-select: none;
    }

    .toggle-text:hover {
      text-decoration: underline;
    }
  </style>

  <script>
    function validateSignup(event) {
      const contact = document.querySelector('input[name="contact"]').value.trim();

      const isPhone = /^\d{10}$/.test(contact); // Exactly 10 digits
      const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact); // Basic email format

      if (!isPhone && !isEmail) {
        alert("Please enter a valid email or a 10-digit phone number.");
        event.preventDefault(); // Stop form from submitting
      }
    }

    function togglePasswordVisibility() {
      const password = document.getElementById("password");
      const toggleText = document.getElementById("togglePasswordText");

      if (password.type === "password") {
        password.type = "text";
        toggleText.textContent = "Hide";
      } else {
        password.type = "password";
        toggleText.textContent = "Show";
      }
    }
  </script>
</head>
<body>
  <div class="container">
    <form action="signup.php" method="POST" class="form-box" onsubmit="validateSignup(event)">
      <h2>Become a member</h2>
      
      <div class="input-group">
        <input type="text" name="username" required />
        <label>Username</label>
      </div>

      <div class="input-group">
        <input type="text" name="contact" required />
        <label>Email or phone</label>
      </div>

      <div class="input-group password-wrapper">
        <input type="password" name="password" id="password" required />
        <label>Password</label>
        <span class="toggle-text" id="togglePasswordText" onclick="togglePasswordVisibility()">Show</span>
      </div>

      <button type="submit">Sign Up</button>

      <p class="login-link">Already have an account? <a href="admin_login.php">Login</a></p>
    </form>
  </div>
</body>
</html>
