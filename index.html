<head>
  <meta charset="UTF-8" />

  <title>Ensils - Clay Utensils</title>
  <meta name="description"

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
    /* ── Theme Tokens ── */
    :root {
      --earth-brown-900: #2c1b18;
      --earth-brown-800: #4a2e2b;
      --earth-brown-700: #6b433d;
      --earth-brown-600: #8c5a52;
      --earth-brown-500: #a97369;
      --earth-brown-400: #c59187;
      --earth-brown-300: #dfb3aa;
      --earth-cream-100: #fbf8f6;
      --earth-cream-50: #ffffff;
      --earth-gold: #d4a373;
      --text-dark: #1f1311;
      --text-muted: #685551;
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 0.3);
      --shadow-sm: 0 2px 4px rgba(44, 27, 24, 0.05);
      --shadow-md: 0 8px 16px rgba(44, 27, 24, 0.08);
      --shadow-lg: 0 12px 24px rgba(44, 27, 24, 0.12);
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Base ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: var(--earth-cream-100);
      color: var(--text-dark);
      font-family: 'Outfit', sans-serif;
      letter-spacing: 0.3px;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Playfair Display', serif;
      color: var(--earth-brown-900);
    }

    a {
      color: var(--earth-brown-600);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    a:hover {
      color: var(--earth-brown-800);
    }

    /* ── Navbar ── */
    .navbar {
      background: var(--glass-bg) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: var(--shadow-sm);
      padding: 14px 0 !important;
      animation: slideDown 0.9s ease forwards;
      transform: translateY(-100%);
      opacity: 0;
      z-index: 100;
    }

    .navbar-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem !important;
      font-weight: 700;
      color: var(--earth-brown-900) !important;
    }

    .navbar-brand:hover {
      color: var(--earth-brown-600) !important;
    }

    .navbar-nav .nav-link {
      font-weight: 500;
      font-size: 1.05rem;
      color: var(--earth-brown-700) !important;
      margin-left: 20px;
      position: relative;
      transition: all var(--transition-normal);
    }

    .navbar-nav .nav-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -4px;
      left: 50%;
      background: var(--earth-brown-600);
      transition: all var(--transition-normal);
      transform: translateX(-50%);
    }

    .navbar-nav .nav-link:hover::after {
      width: 100%;
    }

    .navbar-nav .nav-link:hover {
      color: var(--earth-brown-900) !important;
      transform: translateY(-2px);
    }

    /* ── Auth Buttons ── */
    .auth-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .auth-buttons button {
      background: linear-gradient(135deg, var(--earth-brown-600), var(--earth-brown-800));
      color: #fff;
      padding: 10px 26px;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all var(--transition-normal);
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .auth-buttons button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--earth-brown-500), var(--earth-brown-700));
      z-index: -1;
      transition: opacity var(--transition-normal);
      opacity: 0;
    }

    .auth-buttons button:hover::before {
      opacity: 1;
    }

    .auth-buttons button:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    /* ── Main Content ── */
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
      background: radial-gradient(circle at center, var(--earth-cream-50) 0%, var(--earth-cream-100) 100%);
      animation: fadeInPage 1s ease-in-out;
    }

    .logo-tagline {
      display: flex;
      align-items: center;
      text-align: left;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-lg);
      transition: transform var(--transition-normal);
      max-width: 900px;
      width: 100%;
    }

    .logo-tagline:hover {
      transform: translateY(-5px);
    }

    .main-logo {
      width: 250px;
      height: auto;
      border-radius: 24px;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-normal), box-shadow var(--transition-normal);
      flex-shrink: 0;
    }

    .main-logo:hover {
      transform: rotate(-2deg) scale(1.03);
      box-shadow: var(--shadow-md);
    }

    .tagline {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 500;
      color: var(--earth-brown-900);
      max-width: 600px;
      margin-left: 40px;
      line-height: 1.3;
      opacity: 0;
      animation: slideIn 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      animation-delay: 0.3s;
    }

    /* ── Notice Banner ── */
    .notice-banner {
      background: linear-gradient(135deg, var(--earth-brown-600), var(--earth-brown-800));
      color: #fff;
      text-align: center;
      padding: 14px 20px;
      font-size: 0.97rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      animation: fadeInDown 0.8s ease forwards;
    }

    .notice-banner a {
      color: var(--earth-gold);
      font-weight: 700;
      text-decoration: underline;
    }

    .notice-banner a:hover {
      color: #fff;
    }

    /* ── Footer ── */
    .footer {
      background: #fff;
      color: var(--text-muted);
      border-top: 1px solid var(--earth-brown-300);
      padding: 25px 0;
      text-align: center;
      font-size: 0.95rem;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .logo-tagline {
        flex-direction: column;
        text-align: center;
        padding: 28px;
      }

      .main-logo {
        width: 180px;
      }

      .tagline {
        margin-left: 0;
        margin-top: 20px;
        font-size: 1.6rem;
      }

      .navbar-brand {
        font-size: 1.3rem !important;
      }
    }

    /* ── Animations ── */
    @keyframes fadeInPage {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideDown {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
